<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>rust_gomoku</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <header id="titlebar">
      <span id="app-title">rust_gomoku</span>
      <div id="meta">
        <span class="chip" id="meta-rule">—</span>
        <span class="chip" id="meta-side">—</span>
        <span class="chip" id="meta-difficulty">中级</span>
        <span class="chip" id="meta-moves">第 0 手</span>
      </div>
    </header>
    <header id="statusbar">
      <span id="turn-dot" class="none" aria-hidden="true"></span>
      <span id="status-msg">准备连接引擎…</span>
    </header>
    <main id="board-area">
      <div id="board-wrap">
        <canvas id="board" aria-label="15路五子棋棋盘"></canvas>
      </div>
    </main>
    <nav id="actionbar">
      <button id="btn-undo" class="warn">悔棋</button>
      <button id="btn-newgame" class="primary">新局</button>
      <button id="btn-more">更多</button>
    </nav>
  </div>

  <!-- New game sheet -->
  <div class="sheet-backdrop" data-backdrop="newgame" aria-hidden="true"></div>
  <section class="sheet newgame-sheet" id="sheet-newgame" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-heading">
      <h2>开始新对局</h2>
      <button class="sheet-close" type="button" data-close="newgame" aria-label="关闭">×</button>
    </div>
    <div class="game-options">
      <div class="option-row">
        <label>对战</label>
        <div class="segmented compact" id="opt-gamemode">
          <button data-value="vs_engine" aria-pressed="true">人机</button>
          <button data-value="two_player" aria-pressed="false">双人</button>
        </div>
      </div>
      <div class="option-row" data-engine-only>
        <label>执棋</label>
        <div class="segmented compact" id="opt-side">
          <button data-value="black" aria-pressed="true">执黑</button>
          <button data-value="white" aria-pressed="false">执白</button>
        </div>
      </div>
      <div class="option-row">
        <label>规则</label>
        <div class="segmented compact" id="opt-rule">
          <button data-value="freestyle" aria-pressed="true">无禁手</button>
          <button data-value="renju" aria-pressed="false">有禁手</button>
        </div>
      </div>
      <div class="option-row" data-engine-only>
        <label>模式</label>
        <div class="segmented compact" id="opt-clockmode">
          <button data-value="untimed" aria-pressed="true">不限时</button>
          <button data-value="timed" aria-pressed="false">限时</button>
        </div>
      </div>
      <div class="option-row difficulty-row" id="newgame-difficulty-row" data-engine-only>
        <label>难度</label>
        <button id="opt-difficulty" class="option-link" type="button" data-value="intermediate">
          <span id="difficulty-summary">中级</span>
          <span class="chevron" aria-hidden="true"></span>
        </button>
      </div>
      <div class="option-row" id="newgame-timelimit-row" data-engine-only hidden>
        <label for="opt-timelimit">限时</label>
        <select id="opt-timelimit" class="option-select">
          <option value="200">200 ms</option>
          <option value="500" selected>500 ms</option>
          <option value="1000">1000 ms (1s)</option>
          <option value="2000">2000 ms (2s)</option>
          <option value="5000">5000 ms (5s)</option>
        </select>
      </div>
    </div>
    <div class="sheet-actions">
      <button class="primary" id="btn-start">开始</button>
    </div>
  </section>

  <!-- Difficulty picker -->
  <div id="difficulty-backdrop" aria-hidden="true"></div>
  <section id="difficulty-dialog" role="dialog" aria-modal="true" aria-labelledby="difficulty-title" aria-hidden="true">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-heading">
      <h2 id="difficulty-title">选择难度</h2>
      <button class="sheet-close" type="button" id="btn-difficulty-close" aria-label="关闭">×</button>
    </div>
    <div id="difficulty-options">
      <button class="difficulty-option" type="button" data-value="beginner" aria-pressed="false">
        <span class="strength-icon level-1" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        <span class="difficulty-copy"><strong>入门</strong><small>d1 / w10 · 无战术搜索</small></span>
        <span class="difficulty-check" aria-hidden="true">✓</span>
      </button>
      <button class="difficulty-option" type="button" data-value="junior" aria-pressed="false">
        <span class="strength-icon level-2" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        <span class="difficulty-copy"><strong>初级</strong><small>d2 / w10 · 无战术搜索</small></span>
        <span class="difficulty-check" aria-hidden="true">✓</span>
      </button>
      <button class="difficulty-option" type="button" data-value="intermediate" aria-pressed="true">
        <span class="strength-icon level-3" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        <span class="difficulty-copy"><strong>中级</strong><small>d4 / w20 · 无战术搜索</small></span>
        <span class="difficulty-check" aria-hidden="true">✓</span>
      </button>
      <button class="difficulty-option" type="button" data-value="senior" aria-pressed="false">
        <span class="strength-icon level-4" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        <span class="difficulty-copy"><strong>高级</strong><small>d6 / w30 · VCF / VCT</small></span>
        <span class="difficulty-check" aria-hidden="true">✓</span>
      </button>
      <button class="difficulty-option" type="button" data-value="master" aria-pressed="false">
        <span class="strength-icon level-5" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        <span class="difficulty-copy"><strong>大师</strong><small>d8 / w40 · VCF / VCT</small></span>
        <span class="difficulty-check" aria-hidden="true">✓</span>
      </button>
    </div>
  </section>

  <!-- More / advanced sheet -->
  <div class="sheet-backdrop" data-backdrop="more" aria-hidden="true"></div>
  <section class="sheet" id="sheet-more" role="dialog" aria-modal="true" aria-hidden="true">
    <h2>更多</h2>
    <div class="toggle-row">
      <span>显示全部手数</span>
      <button id="opt-numbers" aria-pressed="false">关</button>
    </div>
    <div class="toggle-row">
      <span>落子音效</span>
      <button id="opt-sound" aria-pressed="true">开</button>
    </div>
    <div class="toggle-row" id="more-difficulty-row">
      <label for="more-difficulty">难度</label>
      <select id="more-difficulty" class="more-select">
        <option value="beginner">入门 · d1</option>
        <option value="junior">初级 · d2</option>
        <option value="intermediate" selected>中级 · d4</option>
        <option value="senior">高级 · d6</option>
        <option value="master">大师 · d8</option>
      </select>
    </div>
    <div class="toggle-row" id="more-timelimit-row" hidden>
      <label for="more-timelimit">每步限时</label>
      <select id="more-timelimit" class="more-select">
        <option value="200">200 ms</option>
        <option value="500" selected>500 ms</option>
        <option value="1000">1000 ms (1s)</option>
        <option value="2000">2000 ms (2s)</option>
        <option value="5000">5000 ms (5s)</option>
      </select>
    </div>
    <label class="toggle-row" id="row-multithread" for="opt-multithread">
      <span id="multithread-label">多线程搜索</span>
      <input id="opt-multithread" type="checkbox" checked>
    </label>
    <details class="advanced">
      <summary>高级 / 引擎信息</summary>
      <div class="kv" id="adv-kv">
        <span class="k">分数</span><span class="v" data-adv="score">—</span>
        <span class="k">深度</span><span class="v" data-adv="depth">—</span>
        <span class="k">节点</span><span class="v" data-adv="nodes">—</span>
        <span class="k">思考耗时</span><span class="v" data-adv="ms">—</span>
        <span class="k">模式</span><span class="v" data-adv="clock">—</span>
        <span class="k">难度</span><span class="v" data-adv="difficulty">—</span>
        <span class="k">线程</span><span class="v" data-adv="threads">—</span>
      </div>
    </details>
    <div class="sheet-actions">
      <button data-close="more">关闭</button>
    </div>
  </section>

  <div id="result-backdrop" aria-hidden="true"></div>
  <section id="result-dialog" role="dialog" aria-modal="true" aria-labelledby="result-title" aria-hidden="true">
    <div id="result-mark" aria-hidden="true"></div>
    <h2 id="result-title">对局结束</h2>
    <p id="result-message"></p>
    <div class="result-actions">
      <button id="btn-result-close">查看棋盘</button>
      <button class="primary" id="btn-result-newgame">再来一局</button>
    </div>
  </section>

  <div id="toast" role="status"></div>

  <script src="ui_logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
